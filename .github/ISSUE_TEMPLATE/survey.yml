name: Survey
description: Propose a new OTel survey.
title: 'Survey: <name>'
labels:
  - end-user-survey
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new OTel survey! This form is for end-users and community members to propose a survey - you don't need to have everything finalized to open it.

        Please remember to change the title of this issue – change `<name>` to the name of your survey.

        Once opened, the tasks below will be tracked and carried out as the proposal moves forward, mainly by End User SIG contributors.
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: The following list contains sub-tasks that need to be completed as part of organising, recording, and publicising the survey. Feel free to add any more tasks you require, but do NOT delete any of the default tasks below.
      value: |
        - [ ] Review End-user SIG [guidance](https://github.com/open-telemetry/sig-end-user/tree/main/end-user-surveys) on how to run surveys in OTel community
        - [ ] Prepare questions
        - [ ] Create a questionnaire from [this template](https://docs.google.com/forms/d/1NsOBVcajq3tm4wDrZTt-5bEG5pR3YfK2yccFGVqVzWI/edit) (@avillela can grant you access)
        - [ ] Publish links to questionnaire
           - [ ] Website banner
           - [ ] Socials via Buffer (LinkedIn, Bluesky, Mastodon)
           - [ ] Reddit
        - [ ] Stop data collection and upload data to [`sig-end-user`](https://github.com/open-telemetry/sig-end-user) repo
           - Create a new folder in `sig-end-user/end-user-surveys`
           - Copy a template from `sig-end-user/end-user-surveys` folder called `README.template.md` and fill it in
           - Upload your data as CSV into the folder (make sure you remove any potentially sensitive info)
        - [ ] Analyze data
        - [ ] Create a report
        - [ ] Write a blog post
        - [ ] Present findings at a maintainers meeting
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Tip
      description: This element is static, used to render a helpful sub-heading for end-users and community members to help prioritize issues. Please leave as is.
      options:
        - <sub>[React](https://github.blog/news-insights/product-news/add-reactions-to-pull-requests-issues-and-comments/) with 👍 to help prioritize this issue. Please use comments to provide useful context, avoiding `+1` or `me too`, to help us triage it. Learn more [here](https://opentelemetry.io/community/end-user/issue-participation/).</sub>
      default: 0
