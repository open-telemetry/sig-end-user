name: OTel Me
description: Propose a new episode of OTel Me
title: 'OTel Me: <name>'
labels:
  - otel-me
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new OTel Me episode! This form is for end-users and community members to propose a session - you don't need to have everything finalized to open it.

        Please remember to change the title of this issue by replacing `<name>` with the actual name for the session. This will be the title used in event invites.

        Once opened, the tasks below will be tracked and carried out as the proposal moves forward, mainly by End User SIG contributors.
  - type: input
    id: date_and_time
    attributes:
      label: Session date and time
      description: Add here the proposed date and time for the event (can be adjusted later).
      placeholder: TBD
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Add here the main description that will be used in promotional posts and event invites. See [OpenTelemetry Live](https://ocgroups.dev/cncf/group/opentelemetry-live) for previous examples.
  - type: markdown
    attributes:
      value: |
        ### Tasks
        The following list contains sub-tasks that need to be completed as part of organising, recording, and publicising the episode. Please replace items with individual links to issues where appropriate.

        - [ ] Confirm speakers
        - [ ] Confirm date and time
        - [ ] Make a copy of the [Q&A interview template](https://docs.google.com/document/d/1vi6NpSj3MvKTuNwFpE8toywHP0sWiH4bsE3AOWvgSwo/edit)
        - [ ] Fill in the template fields highlighted in blue
        - [ ] Create promo image for socials
        - [ ] Create Open Community Groups event
        - [ ] Promote on OpenTelemetry socials (LinkedIn, X, Bluesky, Mastodon, Reddit) - make sure that these point to the CNCF event link
        - [ ] Promote on CNCF Slack channels ([#otel-announcements](https://cloud-native.slack.com/archives/C049G9W5NQ7), [#otel-sig-end-users](https://cloud-native.slack.com/archives/C01RT3MSWGZ), [#o11y-ambassadors](https://cloud-native.slack.com/archives/C050WLWHV1U)) - make sure that these point to the CNCF event link
        - [ ] Host session
        - [ ] Promote recording on socials
  - type: dropdown
    attributes:
      label: Tip
      description: This element is static, used to render a helpful sub-heading for end-users and community members to help prioritize issues. Please leave as is.
      options:
        - <sub>[React](https://github.blog/news-insights/product-news/add-reactions-to-pull-requests-issues-and-comments/) with 👍 to help prioritize this issue. Please use comments to provide useful context, avoiding `+1` or `me too`, to help us triage it. Learn more [here](https://opentelemetry.io/community/end-user/issue-participation/).</sub>
      default: 0
